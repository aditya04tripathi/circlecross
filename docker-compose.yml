services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: circlecross
      POSTGRES_USER: circlecross
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    ports: ["127.0.0.1:8005:8005"]
    depends_on: [postgres, redis]
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    ports: ["127.0.0.1:8006:8006"]
    depends_on: [postgres, redis]
  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    ports: ["127.0.0.1:3005:3000"]
  go:
    build: { context: ., dockerfile: apps/go/Dockerfile }
    profiles: [products]
    ports: ["127.0.0.1:8000:8000"]
  uni:
    build: { context: ., dockerfile: apps/uni/Dockerfile }
    profiles: [products]
    ports: ["127.0.0.1:8001:8001"]
  pro:
    build: { context: ., dockerfile: apps/pro/Dockerfile }
    profiles: [products]
    ports: ["127.0.0.1:8002:8002"]
  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    profiles: [products]
    ports: ["127.0.0.1:8003:8003"]
  docs:
    build: { context: ., dockerfile: apps/docs/Dockerfile }
    profiles: [products]
    ports: ["127.0.0.1:8004:8004"]
volumes:
  postgres_data:
  minio_data:
